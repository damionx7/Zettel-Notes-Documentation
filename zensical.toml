repo_url = "https://github.com/damionx7/Zettel-Notes-Documentation"
edit_uri = "edit/master/docs/"
copyright = '<a href="#__consent">Change cookie settings</a>'
extra_css = ["assets/stylesheets/style.css"]

nav = [
  { "Getting Started" = [
    "index.md",
    "download.md",
    "frequently-asked-questions.md",
    "navigation.md",
    "notes-list.md",
  ] },
  { "Notes" = [
    "note/index.md",
    "note/memo.md",
    "note/editor/index.md",
    "note/editor/markdown.md",
    "note/editor/zettelkasten.md",
    "note/editor/tags.md",
    "note/note-types.md",
    "note/yaml-frontmatter.md",
    "note/created-date.md",
    "templates.md",
  ] },
  { "Repositories" = [
    "repository/index.md",
    { "Synchronization" = [
      "repository/synchronization/index.md",
      "repository/synchronization/git.md",
      "repository/synchronization/dropbox.md",
      "repository/synchronization/webdav.md",
      "repository/synchronization/sftp.md",
      "repository/synchronization/keys-manager.md",
    ] },
    "repository/encryption.md",
    "repository/importer.md",
    "auto-backup.md",
    "recycle-bin.md",
    "storage-manager.md",
  ] },
  { "Organise & Find" = [
    "saved-searches.md",
    "calendar.md",
    "gallery.md",
    "bibtex.md",
  ] },
  { "Share & Integrate" = [
    "note/share-note/index.md",
    "note/share-note/pdf.md",
    "note/share-note/pandoc-termux.md",
    "note/share-note/launcher-shortcuts.md",
    "note/share-note/notifications.md",
    "note/share-note/widgets.md",
    "note/share-note/zettel-links.md",
    "web-clipper.md",
    "tasker.md",
  ] },
  { "Customisation" = [
    "themes/app-theme.md",
    "themes/markdown-theme.md",
    "themes/font-downloader.md",
    "keyboard-shortcuts.md",
    "app-lock.md",
    "translations.md",
  ] },
  { "Plugins" = [
    "plugins/index.md",
    "plugins/ai-actions-plugin.md",
    "plugins/chat-ai-plugin.md",
    "plugins/alarm-plugin.md",
    "plugins/anki-plugin.md",
    "plugins/barcode-plugin.md",
    "plugins/doc-scanner-plugin.md",
    "plugins/donation-plugin.md",
    "plugins/latex-plugin.md",
     "plugins/mermaid-plugin.md",
    "plugins/location-plugin.md",
    "plugins/ocr-plugin.md",
    "plugins/speech-to-text-plugin.md",
    "plugins/speed-read-plugin.md",
    "plugins/telegraph.md",
    "plugins/text-utils.md",
    "plugins/todo-txt-plugin.md",
    "plugins/translate-plugin.md",
  ] },
  { "Changelog" = "changelog.md" },
  { "Tags" = "tags.md" },
]

# Markdown
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

# Theme
[project.theme]
font.text = "Inter"
font.code = "JetBrains Mono"
variant = "modern"
favicon = "favicon-48.png"
logo = "favicon.png"
features = [
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.footer",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "navigation.top",
  "navigation.tracking",
  "toc.follow",
  "search.share",
  "content.action.edit",
  "content.tooltips",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

# Plugins
[project.plugins.search]

[project.plugins.tags]

[project.plugins.privacy]
assets_exclude = ["imasdk.googleapis.com/*"]

[project.plugins.minify]
minify_html = true

# Extra
[project.extra]
generator = false

[project.extra.analytics]
provider = "google"
property = "G-R1E2DWQVC1"

[project.extra.consent]
title = "Cookie consent"
description = "We use cookies to recognize your repeated visits and preferences, as well as to measure the effectiveness of our documentation and whether users find what they're searching for. With your consent, you're helping us to use"

[[project.extra.social]]
icon = "fontawesome/solid/paper-plane"
link = "https://t.me/zettelnotes"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
